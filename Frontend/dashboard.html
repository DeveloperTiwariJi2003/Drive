<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserDashboard</title>
</head>
<body>
    <div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-cloud"></i>

            <span>MyDrive</span>

        </div>

        <nav>

            <a href="#" class="active">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="#">
                <i class="fa-solid fa-image"></i>
                Images
            </a>

            <a href="#">
                <i class="fa-solid fa-file-pdf"></i>
                PDFs
            </a>

            <a href="#">
                <i class="fa-solid fa-video"></i>
                Videos
            </a>

            <a href="#">
                <i class="fa-solid fa-file"></i>
                Others
            </a>

            <a href="#">
                <i class="fa-solid fa-trash"></i>
                Trash
            </a>

        </nav>

        <div class="storage-box">

            <h4>Storage</h4>

            <div class="progress">

                <div id="progress-bar"></div>

            </div>

            <p id="storageText">
                0 MB / 10 GB Used
            </p>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <!-- NAVBAR -->

        <header class="navbar">

            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search files...">

            </div>

            <div class="profile">

                <button id="refreshBtn">

                    <i class="fa-solid fa-rotate"></i>

                </button>

                <button id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                </button>

            </div>

        </header>

        <!-- HERO -->

        <section class="hero">

            <div>

                <h1>
                    Welcome Back 👋
                </h1>

                <p>
                    Upload and manage your files securely.
                </p>

            </div>

            <button
                class="uploadHero"
                onclick="document.getElementById('Manyfile').click()">

                <i class="fa-solid fa-upload"></i>

                Upload Files

            </button>

            <input
                id="Manyfile"
                type="file"
                multiple
                hidden>

        </section>

        <!-- STATS -->

        <section class="stats">

            <div class="card">

                <i class="fa-solid fa-image"></i>

                <h2 id="imageCount">
                    0
                </h2>

                <p>Images</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-file-pdf"></i>

                <h2 id="pdfCount">
                    0
                </h2>

                <p>PDFs</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-video"></i>

                <h2 id="videoCount">
                    0
                </h2>

                <p>Videos</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-folder"></i>

                <h2 id="otherCount">
                    0
                </h2>

                <p>Others</p>

            </div>

        </section>

        <!-- FILES HEADER -->

        <section class="filesHeader">

            <h2>

                Your Files

            </h2>

            <button
                id="uploadButton"
                onclick="sendManyFiles()">

                Upload

            </button>

        </section>

        <!-- FILE GRID -->

        <section
            id="files"
            class="fileGrid">

        </section>

    </main>

</div>
</body>
</html>
