
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">

      <!-- Hamburger -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
        aria-controls="sidebar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Right Side -->
      <div class="nav_Right">

          <!-- desktop COntrols -->
        <div class="desktop-controls">
        <!-- Upload Form select button and refresh button-->
        <button id="selectBtn" type="button" class="btn btn-primary" >Select</button>
        <form id="uploadForm" class="d-flex align-items-center gap-2">

          <input type="file" name="data" id="Manyfile" class="form-control" style="width:250px;"value="select files to upload" multiple />
          <button id="uploadBtn" type="button" class="btn btn-dark d-none">Upload</button>
          <i id="refreshIcon" class="bi bi-arrow-repeat"></i>
        </form>
        <!-- Search Form -->
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search">
          <button class="btn btn-outline-success" type="submit">
            Search
          </button>

        </form>
        <!-- mobile controls -->
      </div>
        <div class="mobile-controls">

        <button class="icon-btn" id="searchBtn" title="Search">&#128269;</button> <!-- magnifying glass -->
      <button class="icon-btn" id="mobileuploadBtn" title="Upload">&#43;</button> <!-- plus icon -->
      <button class="icon-btn" id="menuBtn" title="More">&#8942;</button> <!-- 3 dots -->
    </div>
      </div>
    </div>
    <!-- Dropdown for 3 dots -->
    <div class="Nav_dropdown" id="dropdownMenu">
      <!-- <button>Select files</button> -->
      <button id="mobileSelectBtn" type="button" class="btn btn-primary">Select files</button>
    </div>

    <!-- Hidden upload input for mobile -->
    <div class="flex" id="mobileUpload">
      <input type="file"  name="data"  id="mobileManyFiles" class="form-control" multiple>
      <button id="mobileuploadButton" type="button" class=" btn btn-primary">upload</button>
    </div>

    <!-- Hidden search input for mobile this is ok-->
    <div id="mobileSearch">
      <input type="search" placeholder="Search...">
      <button type="button" class="btn btn-primary">Select files</button>
    </div>
  </nav>
    <div class="progress" role="progressbar" aria-label="Default striped example" aria-valuenow="10" aria-valuemin="0"
      aria-valuemax="100" style="height: 10px">
      <div id="progressBar" class="progress-bar progress-bar-striped" style="width:0%;">
        <p id="progressText"></p>
      </div>
    </div>
  <div class="dashboard">
    <button id="DeleteSelectedBtn" type="button" style="display:none; ">Delete Files</button>
    <div>
      <div id="confirmation"></div>
      
      <h2>Uploaded Files</h2>
      <!-- cards will appear in ul  -->
      <ul id="files">
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script type="module" src="./js/main.js"></script> -->
  <script type="module" src="/script.js"></script>
  <script src="script_for_mobile_nav.js"></script>
</body>

</html>
